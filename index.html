<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Kamera Modern</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">📷 CamConnect</div>
        <button id="btnHome" class="nav-link hidden">Kembali ke Menu</button>
    </nav>

    <div class="container">
        <!-- PEMILIHAN MODE -->
        <div id="modeSelection" class="card fade-in">
            <h2>Pilih Peran</h2>
            <p class="subtitle">Tentukan perangkat ini akan berfungsi sebagai apa</p>
            <div class="btn-group">
                <button id="btnPenerima" class="btn btn-primary">📺 Monitor CCTV (Penerima)</button>
                <button id="btnPengirim" class="btn btn-secondary">📱 Kamera (Pengirim)</button>
            </div>
        </div>

        <!-- UI PENERIMA -->
        <div id="uiPenerima" class="card hidden fade-in">
            <div class="header-penerima">
                <h3>Monitor CCTV</h3>
                <div class="id-badge">ID: <span id="myId">Memuat...</span></div>
            </div>
            <p class="text-muted">Masukkan 8 karakter ID di atas ke perangkat pengirim.</p>
            
            <div id="videoContainer" class="video-grid"></div>
        </div>

        <!-- UI PENGIRIM -->
        <div id="uiPengirim" class="card hidden fade-in">
            <h3>Kirim Kamera</h3>
            <div class="form-group">
                <label>Pilih Kamera Aktif</label>
                <select id="kameraSelect" class="form-control"></select>
            </div>
            <div class="form-group">
                <label>ID Penerima</label>
                <div class="input-group">
                    <!-- Maksimal input 8 karakter -->
                    <input type="text" id="targetId" class="form-control" placeholder="Contoh: A1B2C3D4" maxlength="8">
                    <button id="btnConnect" class="btn btn-primary">Kirim</button>
                </div>
            </div>
            
            <div class="video-wrapper">
                <!-- Tombol X untuk memutus paksa koneksi dari sisi pengirim -->
                <button id="btnDisconnectSender" class="btn-close-overlay" title="Putuskan Koneksi">✖</button>
                <video id="videoKirim" autoplay playsinline muted></video>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
