<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Kamera Multi-Device</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .box { background: white; border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        button, select, input { padding: 8px; margin: 5px 0; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; cursor: pointer; border: none; }
        button:hover { background-color: #0056b3; }
        
        .highlight { font-weight: bold; color: #d9534f; font-size: 20px; letter-spacing: 1px; }
        
        /* Grid untuk Multi-Kamera */
        #videoContainer { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .video-box { background: #222; padding: 10px; border-radius: 8px; text-align: center; color: white; }
        .video-box video { width: 100%; border-radius: 5px; background: #000; }
        .video-box img { width: 100%; margin-top: 10px; border-radius: 5px; }
        #videoKirim { width: 100%; max-width: 600px; border-radius: 8px; background: #000; }
    </style>
</head>
<body>
    <h2>Multi-Device Remote Kamera</h2>

    <div id="modeSelection" class="box">
        <h3>Pilih Peran Perangkat Ini:</h3>
        <button id="btnPenerima">📺 Saya Penerima (Bisa terima banyak HP)</button>
        <button id="btnPengirim">📱 Saya Pengirim (Kamera)</button>
    </div>

    <!-- UI PENERIMA (PC/MONITOR) -->
    <div id="uiPenerima" class="box hidden">
        <h3>Mode Penerima (Monitor CCTV)</h3>
        <p>Berikan ID ini ke semua HP: <span id="myId" class="highlight">Mendapatkan ID...</span></p>
        <p><i>Menunggu koneksi dari HP...</i></p>
        
        <!-- Wadah untuk menampung banyak video otomatis -->
        <div id="videoContainer"></div>
    </div>

    <!-- UI PENGIRIM (HP/KAMERA) -->
    <div id="uiPengirim" class="box hidden">
        <h3>Mode Pengirim (Kamera)</h3>
        <label>Pilih Kamera:</label><br>
        <select id="kameraSelect"></select>
        <br><br>
        
        <label>Masukkan ID Penerima:</label><br>
        <input type="text" id="targetId" placeholder="Contoh: 8a7b6c...">
        <button id="btnConnect">Kirim Video</button>
        <p><small><i>*Bisa klik kirim berkali-kali ke ID yang berbeda</i></small></p>
        
        <br>
        <video id="videoKirim" autoplay playsinline muted></video>
    </div>

    <script>
        const peer = new Peer();
        let localStream = null;
        
        // ARRAY untuk menyimpan BANYAK koneksi sekaligus
        let activeCalls = []; 

        peer.on('open', function(id) {
            document.getElementById('myId').innerText = id;
        });

        // ==========================================
        // LOGIKA PENERIMA (BISA TERIMA BANYAK VIDEO)
        // ==========================================
        document.getElementById('btnPenerima').addEventListener('click', () => {
            document.getElementById('modeSelection').classList.add('hidden');
            document.getElementById('uiPenerima').classList.remove('hidden');

            peer.on('call', function(call) {
                call.answer(); 
                
                call.on('stream', function(remoteStream) {
                    // Mencegah duplikasi video dari ID yang sama (bug bawaan WebRTC)
                    if (document.getElementById("box-" + call.peer)) return;

                    // Bikin elemen HTML baru secara dinamis untuk setiap HP yang masuk
                    const wadahUtama = document.getElementById('videoContainer');
                    
                    const box = document.createElement('div');
                    box.className = 'video-box';
                    box.id = "box-" + call.peer;
                    
                    const judul = document.createElement('h4');
                    judul.innerText = "Kamera: " + call.peer;
                    
                    const video = document.createElement('video');
                    video.autoplay = true;
                    video.playsInline = true;
                    video.muted = true; // Wajib untuk autoplay
                    video.srcObject = remoteStream;

                    const btnSnap = document.createElement('button');
                    btnSnap.innerText = "📸 Jepret Foto";
                    
                    const canvas = document.createElement('canvas');
                    canvas.style.display = 'none';
                    
                    const hasilImg = document.createElement('img');
                    hasilImg.style.display = 'none';

                    // Fitur jepret untuk masing-masing kamera
                    btnSnap.onclick = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                        hasilImg.src = canvas.toDataURL("image/png");
                        hasilImg.style.display = 'block';
                    };

                    // Masukkan semua elemen ke dalam box
                    box.appendChild(judul);
                    box.appendChild(video);
                    box.appendChild(btnSnap);
                    box.appendChild(canvas);
                    box.appendChild(hasilImg);
                    
                    // Tampilkan di layar utama
                    wadahUtama.appendChild(box);
                    
                    video.play().catch(e => console.log(e));
                });
            });
        });

        // ==========================================
        // LOGIKA PENGIRIM 
        // ==========================================
        const kameraSelect = document.getElementById('kameraSelect');
        const videoKirim = document.getElementById('videoKirim');

        document.getElementById('btnPengirim').addEventListener('click', () => {
            document.getElementById('modeSelection').classList.add('hidden');
            document.getElementById('uiPengirim').classList.remove('hidden');
            mulaiKamera(); 
        });

        async function getDaftarKamera() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                kameraSelect.innerHTML = '';
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Kamera ${index + 1}`;
                    kameraSelect.appendChild(option);
                });
            } catch (error) {}
        }

        async function mulaiKamera(deviceId = null) {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' }
            };

            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoKirim.srcObject = localStream;
                
                if (kameraSelect.options.length === 0) {
                    await getDaftarKamera();
                }

                // FIX: Update kamera ke SEMUA perangkat yang sedang tersambung
                activeCalls.forEach(call => {
                    if (call.peerConnection) {
                        const sender = call.peerConnection.getSenders().find(s => s.track.kind === 'video');
                        if (sender) {
                            sender.replaceTrack(localStream.getVideoTracks()[0]);
                        }
                    }
                });
            } catch (error) {
                alert("Gagal akses kamera: " + error);
            }
        }

        kameraSelect.addEventListener('change', () => {
            mulaiKamera(kameraSelect.value);
        });

        document.getElementById('btnConnect').addEventListener('click', () => {
            const target = document.getElementById('targetId').value;
            if (!target) return alert("Masukkan ID Penerima!");

            const call = peer.call(target, localStream);
            
            // Simpan koneksi ke dalam Array biar bisa nyambung ke banyak perangkat sekaligus
            activeCalls.push(call);
            
            alert("Berhasil dikirim ke ID: " + target);
        });
    </script>
</body>
</html>
