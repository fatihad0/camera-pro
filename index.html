<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamConnect Pro - Remote Control</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Mobile (Muncul di layar kecil) -->
    <div class="mobile-header">
        <button id="menuToggle" class="menu-toggle">☰</button>
        <div class="brand-mobile">✨ CamConnect</div>
    </div>

    <div class="app-container">
        <!-- SIDEBAR (Menu Kiri) -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">✨ CamConnect</div>
            
            <div class="menu-section">
                <span class="menu-label">Pilih Sebagai</span>
                <button id="navMonitor" class="nav-btn active">📺 Monitor CCTV</button>
                <button id="navKamera" class="nav-btn">📱 Kamera Web</button>
                <button id="navGaleri" class="nav-btn">🖼️ Galeri</button>
            </div>

            <!-- Pengaturan Kamera Lokal -->
            <div id="sidebarKameraSettings" class="menu-section hidden">
                <span class="menu-label">Pengaturan Kamera</span>
                <select id="kameraSelect" class="form-control"></select>
                
                <div id="nativeControls" class="hidden" style="margin-top: 10px;">
                    <button id="btnTorch" class="nav-btn hidden">🔦 Flash</button>
                    <div id="zoomContainer" class="hidden" style="margin-top: 10px;">
                        <label style="font-size: 0.8rem;">🔍 Zoom:</label>
                        <input type="range" id="zoomSlider" style="width: 100%;">
                    </div>
                </div>
            </div>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="main-content">
            <!-- TAMPILAN MONITOR -->
            <div id="viewMonitor" class="view-panel">
                <div id="monitorDisconnected" class="center-stage">
                    <h3>Siap Menerima Kamera</h3>
                    <div id="qrcode" class="qr-box"></div>
                    <h1 class="main-id">ID: <span id="myIdLarge">Memuat...</span></h1>
                    <p class="text-muted">Scan QR atau masukkan ID di atas pada perangkat kamera.</p>
                </div>

                <div id="monitorConnected" class="hidden">
                    <div class="top-bar">
                        <span class="status-badge">🟢 Terhubung</span>
                        <div class="id-badge-small">ID Monitor: <span id="myIdSmall"></span></div>
                    </div>
                    <div id="videoContainer" class="video-grid"></div>
                </div>
            </div>

            <!-- TAMPILAN KAMERA PENGIRIM -->
            <div id="viewKamera" class="view-panel hidden">
                <div class="top-bar">
                    <div class="input-group">
                        <input type="text" id="targetId" class="form-control" placeholder="Masukkan ID Monitor" maxlength="8">
                        <button id="btnConnect" class="btn btn-primary">Sambungkan</button>
                    </div>
                    <button id="btnDisconnectSender" class="btn btn-danger hidden">✖ Putus</button>
                </div>
                
                <div class="video-wrapper">
                    <div class="screen-awake-indicator">☀️ Layar Aktif</div>
                    <video id="videoKirim" autoplay playsinline muted></video>
                </div>
                <p id="statusPengirim" class="text-muted" style="margin-top:10px;"></p>
            </div>

            <!-- TAMPILAN GALERI -->
            <div id="viewGaleri" class="view-panel hidden">
                <h2>Galeri & Penyimpanan</h2>
                <div class="gallery-info">
                    <p>File rekaman dan jepretan Anda akan tersimpan otomatis di perangkat ini.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
