<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Kamera WebRTC</title>
    <!-- Import Library PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .hidden { display: none; }
        button, select, input { padding: 8px; margin: 5px 0; font-size: 16px; }
        #video { width: 100%; max-width: 600px; background: #000; border-radius: 8px; }
        .highlight { font-weight: bold; color: blue; font-size: 18px; }
    </style>
</head>
<body>
    <h2>Remote Kamera WebRTC</h2>

    <!-- PEMILIHAN MODE -->
    <div id="modeSelection" class="box">
        <h3>Pilih Perangkat:</h3>
        <button id="btnPenerima">💻 Saya di PC (Penerima Kamera)</button>
        <button id="btnPengirim">📱 Saya di HP (Pengirim Kamera)</button>
    </div>

    <!-- TAMPILAN UNTUK PC (PENERIMA) -->
    <div id="uiPenerima" class="box hidden">
        <h3>Mode PC (Penerima)</h3>
        <p>Berikan ID ini ke HP Anda: <span id="myId" class="highlight">Sedang membuat ID...</span></p>
        <p><i>Menunggu koneksi dari HP...</i></p>
        
        <video id="videoTerima" autoplay playsinline></video>
        <br>
        <button id="snap">📸 Jepret Foto</button>
        <br>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="hasil" src="" style="display:none; width: 100%; max-width: 600px; margin-top: 10px;">
    </div>

    <!-- TAMPILAN UNTUK HP (PENGIRIM) -->
    <div id="uiPengirim" class="box hidden">
        <h3>Mode HP (Pengirim)</h3>
        <label>Pilih Kamera:</label><br>
        <select id="kameraSelect"></select>
        <br><br>
        
        <label>Masukkan ID PC:</label><br>
        <input type="text" id="targetId" placeholder="Contoh: 8a7b6c...">
        <button id="btnConnect">Kirim ke PC</button>
        
        <br><br>
        <video id="videoKirim" autoplay playsinline muted></video>
    </div>

    <script>
        // Inisialisasi PeerJS (menggunakan server gratis bawaan PeerJS)
        const peer = new Peer();
        let peerId = null;
        let localStream = null;

        // Mendapatkan ID unik saat PeerJS berhasil konek ke server
        peer.on('open', function(id) {
            peerId = id;
            document.getElementById('myId').innerText = id;
        });

        // ---------------- LOGIKA UNTUK PC (PENERIMA) ----------------
        document.getElementById('btnPenerima').addEventListener('click', () => {
            document.getElementById('modeSelection').classList.add('hidden');
            document.getElementById('uiPenerima').classList.remove('hidden');

            // Jika PC ditelpon (menerima stream)
            peer.on('call', function(call) {
                // Jawab panggilan otomatis
                call.answer(); 
                
                // Jika stream dari HP masuk, tampilkan di tag video PC
                call.on('stream', function(remoteStream) {
                    const videoTerima = document.getElementById('videoTerima');
                    videoTerima.srcObject = remoteStream;
                });
            });
        });

        // Logika Jepret Foto di PC
        document.getElementById('snap').addEventListener('click', () => {
            const videoTerima = document.getElementById('videoTerima');
            const canvas = document.getElementById('canvas');
            const hasil = document.getElementById('hasil');

            if (videoTerima.srcObject) {
                canvas.width = videoTerima.videoWidth;
                canvas.height = videoTerima.videoHeight;
                canvas.getContext('2d').drawImage(videoTerima, 0, 0, canvas.width, canvas.height);
                
                hasil.src = canvas.toDataURL("image/png");
                hasil.style.display = 'block';
            } else {
                alert("Kamera dari HP belum masuk!");
            }
        });

        // ---------------- LOGIKA UNTUK HP (PENGIRIM) ----------------
        const kameraSelect = document.getElementById('kameraSelect');
        const videoKirim = document.getElementById('videoKirim');

        document.getElementById('btnPengirim').addEventListener('click', () => {
            document.getElementById('modeSelection').classList.add('hidden');
            document.getElementById('uiPengirim').classList.remove('hidden');
            mulaiKamera(); // Langsung nyalakan kamera HP
        });

        async function getDaftarKamera() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                kameraSelect.innerHTML = '';
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Kamera ${index + 1}`;
                    kameraSelect.appendChild(option);
                });
            } catch (error) {
                console.error("Gagal mendeteksi kamera:", error);
            }
        }

        async function mulaiKamera(deviceId = null) {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' } // Default kamera belakang
            };

            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoKirim.srcObject = localStream;
                
                if (kameraSelect.options.length === 0) {
                    await getDaftarKamera();
                }
            } catch (error) {
                alert("Gagal akses kamera: " + error);
            }
        }

        kameraSelect.addEventListener('change', () => {
            mulaiKamera(kameraSelect.value);
        });

        // Tombol untuk menghubungkan HP ke PC
        document.getElementById('btnConnect').addEventListener('click', () => {
            const target = document.getElementById('targetId').value;
            if (!target) {
                alert("Masukkan ID PC terlebih dahulu!");
                return;
            }

            // Melakukan panggilan (ngirim stream) ke ID PC
            const call = peer.call(target, localStream);
            alert("Sedang mengirim kamera ke PC...");
        });
    </script>
</body>
</html>
