<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Kamera Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">📷 CamConnect Pro</div>
        <button id="btnHome" class="nav-link hidden">Kembali ke Menu</button>
    </nav>

    <div class="container">
        <!-- PEMILIHAN MODE -->
        <div id="modeSelection" class="card fade-in">
            <h2>Pilih Peran</h2>
            <div class="btn-group">
                <button id="btnPenerima" class="btn btn-primary">📺 Monitor (Penerima)</button>
                <button id="btnPengirim" class="btn btn-secondary">📱 Kamera (Pengirim)</button>
            </div>
        </div>

        <!-- UI PENERIMA -->
        <div id="uiPenerima" class="card hidden fade-in">
            <div class="header-penerima">
                <h3>Monitor CCTV</h3>
                <div class="id-badge">ID: <span id="myId">Memuat...</span></div>
            </div>
            <p class="text-muted">Status: <span id="statusPenerima">Menunggu koneksi...</span></p>
            <div id="videoContainer" class="video-grid"></div>
        </div>

        <!-- UI PENGIRIM -->
        <div id="uiPengirim" class="card hidden fade-in">
            <h3>Kirim Kamera</h3>
            <div class="form-group">
                <label>Pilih Kamera Aktif</label>
                <select id="kameraSelect" class="form-control"></select>
            </div>
            
            <!-- Fitur Kamera Bawaan -->
            <div id="nativeControls" class="form-group hidden" style="background: #f3f4f6; padding: 10px; border-radius: 8px;">
                <label>🎛️ Fitur Kamera Bawaan:</label>
                <button id="btnTorch" class="btn btn-secondary hidden" style="width: 100%; margin-bottom: 10px;">🔦 Nyalakan Flash/Senter</button>
                <div id="zoomContainer" class="hidden">
                    <label style="font-size: 0.8rem;">🔍 Zoom:</label>
                    <input type="range" id="zoomSlider" style="width: 100%;">
                </div>
            </div>

            <div class="form-group">
                <label>ID Penerima</label>
                <div class="input-group">
                    <input type="text" id="targetId" class="form-control" placeholder="Contoh: A1B2C3D4" maxlength="8">
                    <button id="btnConnect" class="btn btn-primary">Sambungkan</button>
                </div>
            </div>
            
            <p id="statusPengirim" class="text-muted"></p>

            <div class="video-wrapper">
                <button id="btnDisconnectSender" class="btn-close-overlay" title="Putuskan Koneksi">✖</button>
                <!-- Menambahkan indikator baterai/layar -->
                <div class="screen-awake-indicator">☀️ Layar Aktif (Anti-Sleep)</div>
                <video id="videoKirim" autoplay playsinline muted></video>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
